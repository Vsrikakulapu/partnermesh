apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: partnermesh
resources:
  - namespace.yaml
  - ../../base
  - postgres.yaml
secretGenerator:
  - name: partnermesh-db
    literals:
      - DB_USERNAME=partnermesh
      - DB_PASSWORD=partnermesh
generatorOptions:
  disableNameSuffixHash: true
images:
  - {name: partnermesh/enrollment-service, newTag: dev}
  - {name: partnermesh/provisioning-service, newTag: dev}
patches:
  - target: {kind: Deployment}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
