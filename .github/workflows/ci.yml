name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and test (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: partnermesh
          POSTGRES_PASSWORD: partnermesh
          POSTGRES_DB: enrollment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partnermesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Create the provisioning database
        run: PGPASSWORD=partnermesh psql -h localhost -U partnermesh -d enrollment -c "CREATE DATABASE provisioning"
      - name: Build and run all tests
        run: mvn -B -ntp verify
      - name: Test report
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          rows, failures = [], []
          for path in sorted(glob.glob("*/target/surefire-reports/TEST-*.xml")):
              suite = ET.parse(path).getroot()
              name = suite.get("name").rsplit(".", 1)[-1]
              rows.append(f"| {name} | {suite.get('tests')} | {suite.get('failures')} | {suite.get('errors')} | {suite.get('skipped')} | {float(suite.get('time')):.1f}s |")
              for case in suite.iter("testcase"):
                  for problem in list(case.findall("failure")) + list(case.findall("error")):
                      failures.append(f"**{name}.{case.get('name')}**\n```\n{(problem.get('message') or '')[:600]}\n{(problem.text or '')[:1500]}\n```")
          print("## Test results\n\n| Suite | Tests | Failures | Errors | Skipped | Time |\n|---|---|---|---|---|---|")
          print("\n".join(rows) or "| (no reports) | | | | | |")
          if failures:
              print("\n## Failures\n")
              print("\n\n".join(failures))
          PY

  docker-e2e:
    name: Docker Compose end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the stack
        run: docker compose up -d --build --wait
      - name: Fault-injection end-to-end test
        run: ./scripts/e2e.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 150 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Stop
        if: always()
        run: docker compose down -v

  kubernetes-e2e:
    name: Kubernetes (kind) end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create kind cluster
        run: |
          command -v kind || { curl -sSLo kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64 && chmod +x kind && sudo mv kind /usr/local/bin/kind; }
          kind create cluster --name partnermesh --wait 120s
      - name: Build images and load them into the cluster
        run: |
          for service in enrollment-service provisioning-service; do
            docker build --build-arg SERVICE=$service -t partnermesh/$service:dev .
            kind load docker-image partnermesh/$service:dev --name partnermesh
          done
      - name: Render and validate manifests
        run: |
          {
            kubectl kustomize deploy/k8s/overlays/aks > /tmp/aks.yaml
            kubectl kustomize deploy/k8s/overlays/local > /tmp/local.yaml
            kubectl apply -f deploy/k8s/overlays/local/namespace.yaml
            kubectl apply --dry-run=server -f /tmp/local.yaml
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Deploy
        run: |
          {
            kubectl apply -k deploy/k8s/overlays/local
            kubectl -n partnermesh rollout status statefulset/postgres --timeout=180s
            kubectl -n partnermesh rollout status deployment/provisioning-service --timeout=300s
            kubectl -n partnermesh rollout status deployment/enrollment-service --timeout=300s
            kubectl -n partnermesh get pods -o wide
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fault-injection end-to-end test through the cluster
        run: |
          kubectl -n partnermesh port-forward svc/enrollment-service 8080:8080 > /dev/null 2>&1 &
          kubectl -n partnermesh port-forward svc/provisioning-service 8081:8081 > /dev/null 2>&1 &
          sleep 5
          ./scripts/e2e.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Cluster state on failure
        if: failure()
        run: |
          {
            echo '```'
            kubectl -n partnermesh get all
            kubectl -n partnermesh get events --sort-by=.lastTimestamp | tail -40
            kubectl -n partnermesh describe pods | tail -60
            kubectl -n partnermesh logs deploy/enrollment-service --all-containers --tail 80 || true
            kubectl -n partnermesh logs deploy/provisioning-service --all-containers --tail 80 || true
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
