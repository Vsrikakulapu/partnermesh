name: Deploy to AKS

# Builds both images, pushes them to Azure Container Registry and applies the AKS overlay.
# Runs only when the repository is configured for Azure:
#   variables: AZURE_DEPLOY_ENABLED=true, ACR_NAME, AKS_RESOURCE_GROUP, AKS_CLUSTER, DATABASE_HOST
#   secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC federated credential)
# The partnermesh-db Secret must already exist in the cluster.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: vars.AZURE_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push images
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          for service in enrollment-service provisioning-service; do
            image="${{ vars.ACR_NAME }}.azurecr.io/partnermesh/$service:${GITHUB_SHA::12}"
            docker build --build-arg SERVICE=$service -t "$image" .
            docker push "$image"
          done
      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER }}
      - name: Apply manifests
        run: |
          cd deploy/k8s/overlays/aks
          tag=${GITHUB_SHA::12}
          registry="${{ vars.ACR_NAME }}.azurecr.io"
          sed -i "s|REGISTRY/|$registry/|; s|newTag: latest|newTag: $tag|" kustomization.yaml
          sed -i "s|DATABASE_HOST|${{ vars.DATABASE_HOST }}|g" database-*.yaml
          kubectl apply -k .
          kubectl -n partnermesh rollout status deployment/provisioning-service --timeout=300s
          kubectl -n partnermesh rollout status deployment/enrollment-service --timeout=300s
