server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: provisioning-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/provisioning}
    username: ${DB_USERNAME:partnermesh}
    password: ${DB_PASSWORD:partnermesh}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
